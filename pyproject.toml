[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surj-snn-study"
version = "0.1.0"
description = "Reproducible accuracy-activity experiments for small spiking neural networks"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.5,<3", "torchvision>=0.20,<1", "snntorch>=0.9.4,<2",
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2", "matplotlib>=3.8,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

